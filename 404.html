<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here — gledach</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0c11">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/site.css">
<script>try{var t=localStorage.getItem('gledach-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>

<header class="bar">
  <div class="wrap bar-in">
    <a class="mark" href="/" aria-label="gledach, home">
      <span class="mark-glyph" aria-hidden="true"></span>gledach
    </a>
    <nav class="bar-nav" aria-label="Sections">
      <a href="/#tools">tools</a>
      <a href="https://github.com/gledach" rel="noopener">github</a>
    </nav>
  </div>
</header>

<main class="lost">
  <div class="wrap">
    <h1>404 — nothing is watching this path</h1>
    <p>
      The page you asked for is not here. Tool previews live on their own subdomains
      (<code>&lt;tool&gt;-&lt;version&gt;.gledach.de</code>) rather than under this one, so a
      link to a preview path on <code>gledach.de</code> will always land here.
    </p>
    <p class="cta-line">
      <a class="btn btn-primary" href="/#tools">the tools <span aria-hidden="true">→</span></a>
      <a class="btn" href="https://signal-v1.gledach.de" rel="noopener">signal-v1 preview</a>
    </p>
  </div>
</main>

</body>
</html>
