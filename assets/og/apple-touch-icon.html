<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>apple-touch-icon · 180x180</title>

<!-- The source of /apple-touch-icon.png. Render at exactly 180x180.

     Full bleed and square on purpose. iOS applies its own corner mask, so an
     icon that arrives already rounded gets rounded twice and sits inside a
     visible notch of background. The .svg favicon keeps its 9px radius because
     nothing masks that one. -->

<style>
  html, body { margin: 0; padding: 0; width: 180px; height: 180px; overflow: hidden; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"
     role="img" aria-label="gledach">
  <rect width="180" height="180" fill="#0F1115"/>
  <!-- The favicon's three rising bars, scaled by 180/32. Tallest carries the accent. -->
  <rect x="39.4"  y="106.9" width="25.3" height="33.8"  rx="9" fill="#9BA0AD"/>
  <rect x="77.3"  y="78.7"  width="25.3" height="61.9"  rx="9" fill="#9BA0AD"/>
  <rect x="115.3" y="39.4"  width="25.3" height="101.3" rx="9" fill="#C2452E"/>
</svg>
</body>
</html>
