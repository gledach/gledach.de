<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn cover C · dark</title>

<!-- ═══════════════════════════════════════════════════════════════════════
     LinkedIn PERSONAL profile cover, variant C. Render at exactly 1584x396.
     Same safe zone as A and B: nothing readable inside x 0-430 or the
     bottom 90px. Add #guides to the URL to see it drawn.

     C is the dark one. It exists because a light banner and a light profile
     photo blur into each other, and most profile photos are shot against a
     pale background. Ink here gives the avatar a hard edge to sit against.
     ═══════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  :root {
    --indigo: #533afd;
    --indigo-soft: #7389ff;
    --lavender: #b9b9f9;
    --lilac: #d6d9fc;
    --ink: #061b31;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1584px; height: 396px; }
  body {
    background: var(--ink);
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-feature-settings: "ss01" on, "tnum" on;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }

  /* A faint grid, the only texture. Reads as graph paper rather than as a
     pattern, and it disappears entirely at thumbnail size. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  .stripes { position: absolute; inset: 0 0 0 auto; display: flex; height: 100%; }
  .stripes i { display: block; width: 26px; height: 100%; }
  .stripes i:nth-child(1) { background: rgba(255,255,255,.04); }
  .stripes i:nth-child(2) { background: rgba(83,58,253,.30); }
  .stripes i:nth-child(3) { background: rgba(83,58,253,.55); }
  .stripes i:nth-child(4) { background: var(--indigo); }
  .stripes i:nth-child(5) { background: var(--lavender); }

  .plate { position: absolute; left: 470px; top: 60px; width: 1050px; }

  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lavender);
    margin-bottom: 26px;
  }
  .mark { display: inline-flex; gap: 4px; align-items: flex-end; }
  .mark i { width: 4px; background: var(--lavender); border-radius: 1px; }
  .mark i:nth-child(1) { height: 20px; }
  .mark i:nth-child(2) { height: 14px; opacity: 0.6; }
  .mark i:nth-child(3) { height: 9px;  opacity: 0.35; }

  h1 {
    font-size: 60px;
    font-weight: 300;
    line-height: 1.08;
    letter-spacing: -1.6px;
    color: var(--white);
  }
  /* On ink, the pure indigo drops to 1.6:1 and is unreadable. The payoff
     phrase takes lavender instead, which clears 8.9:1. */
  h1 em { font-style: normal; color: var(--lavender); }

  .meta {
    display: flex; align-items: center; gap: 14px;
    margin-top: 30px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    letter-spacing: 0.02em;
    color: var(--lilac);
  }
  .meta b { color: var(--white); font-weight: 500; }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--indigo-soft); }

  .guide { display: none; }
  body.guides .guide { display: block; }
  .guide-avatar {
    position: absolute; left: 76px; bottom: -40px;
    width: 300px; height: 300px; border-radius: 50%;
    background: rgba(255, 80, 80, .30); border: 3px solid #ff5050;
  }
  .guide-dead-left {
    position: absolute; left: 0; top: 0; width: 430px; height: 100%;
    background: repeating-linear-gradient(45deg, rgba(255,80,80,.12) 0 10px, transparent 10px 20px);
    border-right: 2px dashed #ff5050;
  }
  .guide-dead-bottom {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 90px;
    background: repeating-linear-gradient(45deg, rgba(255,80,80,.12) 0 10px, transparent 10px 20px);
    border-top: 2px dashed #ff5050;
  }
</style>
</head>
<body>

<div class="grid" aria-hidden="true"></div>
<div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<div class="plate">
  <p class="eyebrow">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    gledach · open source
  </p>
  <h1>I build tools that turn public<br>noise into <em>structured signal.</em></h1>
  <p class="meta">
    <b>gledach.de</b>
    <span class="dot"></span> MIT licensed
    <span class="dot"></span> no account to start
    <span class="dot"></span> your machine is the runtime
  </p>
</div>

<div class="guide guide-dead-left"></div>
<div class="guide guide-dead-bottom"></div>
<div class="guide guide-avatar"></div>

<script>
  if (location.hash === '#guides') document.body.classList.add('guides');
</script>
</body>
</html>
